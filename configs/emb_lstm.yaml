name: emb_lstm
type: neural
arch: lstm
seeds: [42, 43, 44]
data:
  train: data/processed/train.csv
  val: data/processed/val.csv
embeddings: embeddings/fasttext_ar_300.npz
freeze_embeddings: false
hidden: 128
layers: 2
max_len: 64
dropout: 0.3
batch_size: 64
lr: 1.0e-3
epochs: 30
patience: 4
device: auto
output_dir: models/emb_lstm
